services:
  elasticsearch:
    image: elasticsearch:8.10.2
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "xpack.ml.enabled=false"
    volumes:
      - ./config/analysis:/usr/share/elasticsearch/config/analysis
      - elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
  selenium:
    image: seleniarm/standalone-chromium:latest
    shm_size: '2gb'
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"  # noVNC for visual debugging
  web:
    build: .
    command: bash -c "bundle check || bundle install && yarn install --check-files && rm -rf tmp/cache/* && rm -f tmp/pids/server.pid && bin/dev"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    environment:
      - USER=${USER}
      - ELASTICSEARCH_URL=elasticsearch
      - theme=umn
      - SELENIUM_URL=http://selenium:4444
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - elasticsearch
      - postgres
      - selenium
volumes:
  postgres:
  elasticsearch:
  bundle_cache:
  node_modules:
